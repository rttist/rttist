[package]
name = "rttist_swc_transformer"
version = "0.1.0"
edition = "2021"

#[lib]
#name = "rttist_swc_transformer"
#crate-type = ["cdylib"]

#[profile.release]
#lto = true

[dependencies]
#path-absolutize = "3.1.0"
serde = "1"
swc = "0.265.*"
swc_core = { version = "0.82.*", features = ["ecma_plugin_transform"] }
swc_ecma_parser = "0.139.1"
swc_common = "0.32.*"
swc_ecma_ast = "0.109.1"
#wasm-bindgen = { version = "0.2.82", features = ["enable-interning"] }

# .cargo/config defines few alias to build plugin.
# cargo build-wasi generates wasm-wasi32 binary
# cargo build-wasm32 generates wasm32-unknown-unknown binary.