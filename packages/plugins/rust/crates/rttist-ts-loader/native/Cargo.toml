[package]
name = "rttist_ts_loader"
version = "0.1.0"
authors = ["Roman Jámbor <hookcze@gmail.com>"]
license = "MIT"
build = "build.rs"
edition = "2018"
exclude = ["artifacts.json", "index.node"]

[lib]
name = "rttist_ts_loader"
crate-type = ["cdylib"]

[build-dependencies]
neon-build = "0.10.1"

[dependencies]
neon = "0.10.1"
rttist_swc_transformer = { path = "../../rttist-swc-transformer" }
swc_core = { version = "0.82.*", features = ["ecma_plugin_transform"] }
